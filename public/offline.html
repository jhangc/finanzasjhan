<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f172a">
    <title>Sin conexión · FinControl</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               font-family: ui-sans-serif, system-ui, sans-serif; background: #f1f5f9; color: #0f172a; padding: 1rem; }
        .card { background: #fff; border-radius: 1rem; padding: 2rem; text-align: center; max-width: 22rem;
                box-shadow: 0 1px 2px rgba(0,0,0,.06); }
        button { margin-top: 1rem; border: 0; border-radius: .75rem; background: #0f172a; color: #fff;
                 padding: .6rem 1.2rem; font-weight: 600; font-size: 1rem; }
    </style>
</head>
<body>
    <div class="card">
        <img src="/icons/icon.svg" alt="" width="64" height="64">
        <h1>Sin conexión</h1>
        <p>FinControl necesita internet para mostrar tus números actualizados.</p>
        <button onclick="location.reload()">Reintentar</button>
    </div>
</body>
</html>
